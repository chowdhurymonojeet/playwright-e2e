[pytest]
addopts = -ra
asyncio_mode = auto
testpaths = tests
xfail_strict = true
markers =
    smoke: fast feedback coverage that should run on each pull request
    api: service-level validation that bypasses the UI
    ui: browser automation against user-facing flows
    e2e: full-stack workflows spanning UI, API, and database checks
    regression: broader non-smoke regression coverage
    db: direct data-integrity validation against approved lower environments
